<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création d'un Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animation personnalisée */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* Style personnalisé pour le champ de date/heure */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }
        
        /* Style pour le textarea */
        .custom-textarea {
            min-height: 120px;
            resize: none;
            transition: border-color 0.3s ease;
        }
        
        .custom-textarea:focus {
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
    </style>
    <script>
        function validateForm() {
            const nom = document.getElementById('nom').value;
            const description = document.getElementById('description').value;
            const statut = document.getElementById('statut').value;
            
            if (!nom.trim()) {
                alert('Le nom du projet est requis');
                return false;
            }
            if (!description.trim()) {
                alert('La description du projet est requise');
                return false;
            }
            if (!statut.trim()) {
                alert('Le statut du projet est requis');
                return false;
            }
            return true;
        }
    </script>
</head>
<body class="bg-gradient-to-br from-green-50 to-greenyellow-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-xl shadow-2xl overflow-hidden animate-fade-in">
        <!-- Header -->
        <div class="bg-gradient-to-r from-green-600 to-greenyellow-500 p-6 text-white">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold flex items-center">
                    <i class="fas fa-project-diagram mr-3"></i>
                    Créer un nouveau projet
                </h1>
                <span class="bg-white bg-opacity-20 px-3 py-1 rounded-full text-sm">Version 1.0</span>
            </div>
            <p class="mt-2 text-green-100">Remplissez les détails de votre projet ci-dessous</p>
        </div>
        
        <!-- Formulaire -->
        <form class="p-6 space-y-6" id="projectForm" action="index.php?controleur=controleurAjoutProjet&action=creerProjet" method="post" onsubmit="return validateForm()">
            <!-- Nom du projet -->
            <div class="space-y-2">
                <label class="block text-gray-700 font-medium flex items-center">
                    <i class="fas fa-heading text-green-500 mr-2 w-5"></i>
                    Nom du projet
                </label>
                <div class="relative">
                    <input type="text" name="nom" id="nom" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 transition duration-200" placeholder="Ex: Projet Écologique">
                </div>
            </div>
            
            <!-- Description -->
            <div class="space-y-2">
                <label class="block text-gray-700 font-medium flex items-center">
                    <i class="fas fa-align-left text-green-500 mr-2 w-5"></i>
                    Description
                </label>
                <textarea name="description" id="description" required class="w-full px-4 py-3 rounded-lg border border-gray-300 custom-textarea" placeholder="Décrivez votre projet en détail..."></textarea>
            </div>
            
            <!-- Statut -->
            <div class="space-y-2">
                <label class="block text-gray-700 font-medium flex items-center">
                    <i class="fas fa-tag text-green-500 mr-2 w-5"></i>
                    Statut du projet
                </label>
                <select name="statut" id="statut" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 transition duration-200">
                    <option value="">Sélectionnez un statut</option>
                    <option value="En cours">En cours</option>
                    <option value="En attente">En attente</option>
                    <option value="Terminé">Terminé</option>
                </select>
            </div>
            
            <!-- Boutons d'action -->
            <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4">
                <button type="submit" class="px-6 py-3 rounded-lg bg-gradient-to-r from-green-600 to-greenyellow-500 text-white hover:from-green-700 hover:to-greenyellow-600 transition duration-200 font-medium flex items-center justify-center shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    <i class="fas fa-plus mr-2"></i>
                    Créer le projet
                </button>
            </div>
        </form>
    </div>
</body>
</html>
